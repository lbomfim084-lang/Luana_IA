name: Build LUANA Android APK

# Roda automaticamente a cada push na branch principal, ou manualmente
# pela aba "Actions" do GitHub (dá pra disparar isso tudo pelo navegador
# do celular, sem precisar de computador).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Preparar pasta www para o Capacitor
        run: |
          mkdir -p www
          cp -r index.html style.css app.js manifest.json service-worker.js modules assets www/

      - name: Adicionar projeto Android (se ainda não existir)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sincronizar web -> Android
        run: npx cap sync android

      - name: Build do APK (debug)
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: luana-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
